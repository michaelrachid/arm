<html lang="pt"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>ARM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface2: #f1efe8;
  --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.17);
  --text: #1a1a18; --text2: #6b6b67; --text3: #b0b0aa;
  --radius: 12px; --radius-sm: 8px;
  --green-bg: #E1F5EE; --green: #0F6E56;
  --blue-bg: #E6F1FB; --blue: #185FA5;
  --amber-bg: #FAEEDA; --amber: #854F0B;
  --purple-bg: #EEEDFE; --purple: #534AB7;
  --red-bg: #FCEBEB; --red: #A32D2D;
  --gray-bg: #F1EFE8; --gray: #5F5E5A;
  --coral-bg: #FAECE7; --coral: #993C1D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --surface: #232321; --surface2: #2c2c2a;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --text2: #a0a09a; --text3: #6b6b67;
    --green-bg: #0d2e22; --blue-bg: #0d1f35; --amber-bg: #2e1f06;
    --purple-bg: #1a1830; --red-bg: #2e0d0d; --gray-bg: #252523; --coral-bg: #2e1208;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
.app { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
.header-left { display: flex; align-items: baseline; gap: 8px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.sub { font-size: 12px; color: var(--text2); }
.header-actions { display: flex; gap: 6px; }
.btn { padding: 7px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 600; transition: opacity 0.15s; font-family: inherit; letter-spacing: 0.01em; }
.btn-add { background: var(--text); color: var(--bg); border: none; }
.btn-export { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); }
.btn:hover { opacity: 0.72; }

/* DASHBOARD */
.dashboard { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.dash-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 0.75rem; }
.dash-section { margin-bottom: 0.75rem; }
.dash-section:last-child { margin-bottom: 0; }
.dash-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
.dash-items { display: flex; flex-direction: column; gap: 4px; }
.dash-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dash-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dash-name { font-weight: 500; }
.dash-when { color: var(--text2); font-size: 12px; }
.dash-empty { font-size: 13px; color: var(--text3); font-style: italic; }
.dash-divider { height: 0.5px; background: var(--border); margin: 0.75rem 0; }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.65rem 0.9rem; }
.stat-n { font-size: 20px; font-weight: 700; }
.stat-l { font-size: 11px; color: var(--text2); margin-top: 1px; }

/* FILTERS */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.filter-btn { font-size: 12px; padding: 5px 13px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; font-family: inherit; }
.filter-btn.active { background: var(--text); color: var(--bg); border-color: transparent; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 0.9rem; transition: border-color 0.15s; }
.card:hover { border-color: var(--border2); }
.card.archived { opacity: 0.38; }
.card.has-event { border-left: 3px solid var(--green); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.card-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.card-meta { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
.card-note { font-size: 11px; color: var(--text2); border-top: 0.5px solid var(--border); padding-top: 7px; margin-top: 7px; line-height: 1.55; }
.card-event { font-size: 11px; color: var(--green); margin-top: 7px; font-weight: 500; }
.card-next-text { font-size: 11px; color: var(--blue); margin-top: 5px; }
.card-actions { display: flex; gap: 5px; margin-top: 8px; border-top: 0.5px solid var(--border); padding-top: 7px; flex-wrap: wrap; }
.card-btn { font-size: 10px; padding: 3px 9px; border-radius: 5px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; transition: background 0.12s; }
.card-btn:hover { background: var(--surface2); }
.card-btn.danger { color: var(--red); border-color: #F7C1C1; }
.card-btn.danger:hover { background: var(--red-bg); }
.empty { text-align: center; padding: 3rem; color: var(--text3); font-size: 13px; }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.48); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
.overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 1.25rem; width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto; }
.modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 1.1rem; }
.field { margin-bottom: 0.85rem; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 10px; border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
  font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.15s;
  -webkit-appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--text); }
.field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
.btn-cancel { padding: 7px 14px; border-radius: 8px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 13px; }
.btn-save { padding: 7px 16px; border-radius: 8px; border: none; background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; }
.btn-cancel:hover { background: var(--surface2); }
.btn-save:hover { opacity: 0.85; }
.hint { font-size: 11px; color: var(--text3); margin-top: 3px; }

@media (max-width: 500px) {
  .app { padding: 1rem 0.75rem; }
}
</style>
</head>
<body>

      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveContact()">Salvar</button>
    </div>
  </div>
</div>

const FILTERS = ["todos","ativo","agendado","pendente","novo","limbo","manutenção","observação","experimento","arquivo"];
const FILTER_LABELS = { arquivo:"arquivo morto" };
let people = [], activeFilter = "todos", editingId = null;

function load() {
  const saved = localStorage.getItem("arm_v3");
  people = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SEED));
  // migração: remove "cat" e garante os campos novos (comuna, profissao)
  const seedById = {}; SEED.forEach(x => seedById[x.id] = x);
  let dirty = false;
  people.forEach(p => {
    if ("cat" in p) { if (p.cat==="arquivo") p.status="arquivo"; delete p.cat; dirty = true; }
    const sd = seedById[p.id];
    if (p.comuna===undefined)    { p.comuna    = sd ? (sd.comuna||"")    : ""; dirty = true; }
    if (p.profissao===undefined) { p.profissao = sd ? (sd.profissao||"") : ""; dirty = true; }
    if (p.canal===undefined) {
      const CH = {W:"WhatsApp", S:"Scruff", G:"Grindr", T:"Tinder"};
      const mc = (p.note||"").match(/^([WSGT])\s+/);
      if (mc) { p.canal = CH[mc[1]]; p.note = p.note.slice(mc[0].length); }
      else p.canal = sd ? (sd.canal||"") : "";
      dirty = true;
    }
  });
  if (dirty) save();
}
function save() { localStorage.setItem("arm_v3", JSON.stringify(people)); }
function nextId() { return people.length ? Math.max(...people.map(p=>p.id))+1 : 1; }
function initials(n) { return n.slice(0,2).toUpperCase(); }
function colorFor(p) {
  if (p.status==="arquivo") return { bg:"var(--gray-bg)", text:"var(--gray)" };
  return { bg:"var(--green-bg)", text:"var(--green)" };
}

function parseEventDate(p) {
  if (!p.eventDate) return null;
  const d = new Date(p.eventDate + (p.eventTime ? "T" + p.eventTime : "T00:00"));
  return isNaN(d) ? null : d;
}

function formatEventDisplay(p) {
  const d = parseEventDate(p);
  if (!d) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const eDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((eDay - today) / 86400000);
  const timeStr = p.eventTime ? ` ${p.eventTime}` : "";
  const dow = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()];
  const dateStr = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  if (days < 0) return { label: `${dateStr}${timeStr} (passou)`, past: true };
  if (days === 0) return { label: `Hoje${timeStr}`, today: true };
  if (days === 1) return { label: `Amanhã${timeStr}`, soon: true };
  if (days <= 6) return { label: `${dow} ${dateStr}${timeStr}`, soon: true };
  return { label: `${dow} ${dateStr}${timeStr}`, future: true };
}

function renderDashboard() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const in7 = new Date(today); in7.setDate(today.getDate()+7);

  const active = people.filter(p => p.status !== "arquivo");
  const withDates = active.filter(p => parseEventDate(p)).sort((a,b) => parseEventDate(a)-parseEventDate(b));

  const todayEvents   = withDates.filter(p => { const d=parseEventDate(p); const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return e.getTime()===today.getTime(); });
  const tomorrowEvents= withDates.filter(p => { const d=parseEventDate(p); const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return e.getTime()===tomorrow.getTime(); });
  const weekEvents    = withDates.filter(p => { const d=parseEventDate(p); const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return e>tomorrow && e<=in7; });
  const stale         = active.filter(p => !parseEventDate(p) && ["ativo","agendado","pendente"].includes(p.status));

  function itemHTML(p) {
    const ev = formatEventDisplay(p);
    const timeStr = ev ? ` · ${ev.label}` : "";
    return `<div class="dash-item"><div class="dash-dot" style="background:${colorFor(p).text}"></div><span class="dash-name">${p.name}</span><span class="dash-when">${timeStr}${p.next ? " — " + p.next : ""}</span></div>`;
  }

  let html = `<div class="dash-title">Dashboard</div>`;

  if (todayEvents.length) {
    html += `<div class="dash-section"><div class="dash-label">Hoje</div><div class="dash-items">${todayEvents.map(itemHTML).join("")}</div></div>`;
    if (tomorrowEvents.length || weekEvents.length || stale.length) html += `<div class="dash-divider"></div>`;
  }
  if (tomorrowEvents.length) {
    html += `<div class="dash-section"><div class="dash-label">Amanhã</div><div class="dash-items">${tomorrowEvents.map(itemHTML).join("")}</div></div>`;
    if (weekEvents.length || stale.length) html += `<div class="dash-divider"></div>`;
  }
  if (weekEvents.length) {
    html += `<div class="dash-section"><div class="dash-label">Esta semana</div><div class="dash-items">${weekEvents.map(itemHTML).join("")}</div></div>`;
    if (stale.length) html += `<div class="dash-divider"></div>`;
  }
  if (stale.length) {
    html += `<div class="dash-section"><div class="dash-label">Sem data — acompanhar</div><div class="dash-items">${stale.map(p=>`<div class="dash-item"><div class="dash-dot" style="background:var(--text3)"></div><span class="dash-name">${p.name}</span><span class="dash-when">${p.next ? " · " + p.next : ""}</span></div>`).join("")}</div></div>`;
  }
  if (!todayEvents.length && !tomorrowEvents.length && !weekEvents.length && !stale.length) {
    html += `<span class="dash-empty">Pipeline limpo por enquanto.</span>`;
  }

  document.getElementById("dashboard").innerHTML = html;
}

function renderStats() {
  const a = people.filter(p=>["ativo","agendado"].includes(p.status)).length;
  const b = people.filter(p=>["pendente","novo","limbo"].includes(p.status)).length;
  const d = people.filter(p=>p.status==="arquivo").length;
  document.getElementById("stats").innerHTML =
    [{n:a,l:"ativos"},{n:b,l:"em aberto"},{n:d,l:"arquivo"}]
    .map(x=>`<div class="stat"><div class="stat-n">${x.n}</div><div class="stat-l">${x.l}</div></div>`).join("");
}

function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f=>
    `<button class="filter-btn ${f===activeFilter?"active":""}" onclick="setFilter('${f}')">${FILTER_LABELS[f]||f}</button>`
  ).join("");
}

function setFilter(f) { activeFilter=f; render(); }

function renderCard(p) {
  const c  = colorFor(p);
  const sc = STATUS_COLOR[p.status] || STATUS_COLOR["manutenção"];
  const ar = p.status==="arquivo";
  const ev = formatEventDisplay(p);
  const hasEvent = ev && !ev.past;
  return `<div class="card ${ar?"archived":""} ${hasEvent?"has-event":""}">
    <div class="card-top">
      <div class="avatar" style="background:${c.bg};color:${c.text}">${initials(p.name)}</div>
      <span style="display:flex;gap:4px;align-items:center">${p.canal?`<span class="badge" style="background:var(--gray-bg);color:var(--gray)">${p.canal}</span>`:""}<span class="badge" style="background:${sc.bg};color:${sc.text}">${p.status}</span></span>
    </div>
    <div class="card-name">${p.name}</div>
    <div class="card-meta">${p.age?p.age+" · ":""}${p.origin||""} · ${p.role||""}</div>
    ${(p.comuna||p.profissao) ? `<div class="card-meta">${[p.comuna?"📍 "+p.comuna:"", p.profissao?"💼 "+p.profissao:""].filter(Boolean).join(" · ")}</div>` : ""}
    <div class="card-note">${p.note||""}</div>
    ${(p.meetings||p.sex) ? `<div class="card-note" style="display:flex;gap:10px;margin-top:5px;border-top:none;padding-top:0">${p.meetings!=null&&p.meetings>0?`<span>🤝 ${p.meetings} encontro${p.meetings===1?"":"s"}</span>`:""}${p.sex?`<span>${p.sex==="sim"?"❤️ Sexo: sim":"○ Sexo: não"}</span>`:""}</div>` : ""}
    ${ev ? `<div class="card-event">📅 ${ev.label}</div>` : ""}
    ${p.next && !ev ? `<div class="card-next-text">→ ${p.next}</div>` : ""}
    ${p.next && ev ? `<div class="card-next-text">${p.next}</div>` : ""}
    <div class="card-actions">
      <button class="card-btn" onclick="openModal(${p.id})">Editar</button>
      <button class="card-btn" onclick="archiveContact(${p.id})">${ar?"Restaurar":"Arquivar"}</button>
      <button class="card-btn danger" onclick="deleteContact(${p.id})">Apagar</button>
    </div>
  </div>`;
}

function render() {
  renderDashboard();
  renderStats();
  renderFilters();
  const filtered = activeFilter==="todos"
    ? people.filter(p=>p.status!=="arquivo")
    : people.filter(p=>p.status===activeFilter);
  const sorted = [...filtered].sort((a,b)=>{
    const da=parseEventDate(a), db=parseEventDate(b);
    if(da&&db) return da-db;
    if(da) return -1;
    if(db) return 1;
    return 0;
  });
  document.getElementById("board").innerHTML = sorted.length
    ? `<div class="grid">${sorted.map(renderCard).join("")}</div>`
    : `<div class="empty">Nenhum contato aqui.</div>`;
}

function openModal(id) {
  editingId = id||null;
  document.getElementById("modal-title").textContent = id?"Editar":"Novo contato";
  if (id) {
    const p = people.find(x=>x.id===id);
    document.getElementById("f-name").value       = p.name||"";
    document.getElementById("f-age").value        = p.age||"";
    document.getElementById("f-origin").value     = p.origin||"";
    document.getElementById("f-role").value       = p.role||"";
    document.getElementById("f-comuna").value     = p.comuna||"";
    document.getElementById("f-prof").value       = p.profissao||"";
    document.getElementById("f-canal").value      = p.canal||"";
    document.getElementById("f-status").value     = p.status||"ativo";
    document.getElementById("f-event-date").value = p.eventDate||"";
    document.getElementById("f-event-time").value = p.eventTime||"";
    document.getElementById("f-next").value       = p.next||"";
    document.getElementById("f-note").value       = p.note||"";
    document.getElementById("f-meetings").value   = p.meetings!=null?p.meetings:"";
    document.getElementById("f-sex").value        = p.sex||"";
  } else {
    ["f-name","f-age","f-origin","f-role","f-comuna","f-prof","f-event-date","f-event-time","f-next","f-note","f-meetings"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("f-sex").value="";
    document.getElementById("f-canal").value="";
    document.getElementById("f-status").value="novo";
  }
  document.getElementById("overlay").classList.add("open");
}

function closeModal() { document.getElementById("overlay").classList.remove("open"); editingId=null; }

function saveContact() {
  const name = document.getElementById("f-name").value.trim();
  if (!name) { alert("Nome é obrigatório."); return; }
  const data = {
    name, age: parseInt(document.getElementById("f-age").value)||null,
    origin:    document.getElementById("f-origin").value.trim(),
    role:      document.getElementById("f-role").value.trim(),
    comuna:    document.getElementById("f-comuna").value.trim(),
    profissao: document.getElementById("f-prof").value.trim(),
    canal:     document.getElementById("f-canal").value,
    status:    document.getElementById("f-status").value,
    eventDate: document.getElementById("f-event-date").value,
    eventTime: document.getElementById("f-event-time").value,
    next:      document.getElementById("f-next").value.trim(),
    note:      document.getElementById("f-note").value.trim(),
    meetings:  parseInt(document.getElementById("f-meetings").value)||0,
    sex:       document.getElementById("f-sex").value,
  };
  if (editingId) { const i=people.findIndex(p=>p.id===editingId); people[i]={...people[i],...data}; }
  else people.push({id:nextId(),...data});
  save(); closeModal(); render();
}

function archiveContact(id) {
  const p=people.find(x=>x.id===id); if(!p) return;
  p.status = p.status==="arquivo" ? "ativo" : "arquivo";
  save(); render();
}

function deleteContact(id) {
  if(!confirm("Apagar definitivamente?")) return;
  people=people.filter(p=>p.id!==id); save(); render();
}

function exportHTML() {
  const snapshot = JSON.stringify(people);
  const html = document.documentElement.outerHTML.replace(
    /const SEED = \[.*?\];/s,
    "const SEED = " + snapshot + ";"
  );
  const blob = new Blob([html],{type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ARM_" + new Date().toISOString().slice(0,10) + ".html";
  a.click();
}

document.getElementById("overlay").addEventListener("click",function(e){if(e.target===this)closeModal();});
load(); render();
</script>
